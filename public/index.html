<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KILLER 07 - Horror Multiplayer</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="overlay">
    <div class="logo-box">
      <h1 class="glitch-title">KILLER 07</h1>
      <p class="sub-logo">3D HORROR SURVIVAL</p>
    </div>
    <div class="form-box">
      <input type="text" id="player-name" placeholder="Display Name" value="Survivor">
      <input type="text" id="player-username" placeholder="Username" value="user07">
      <button id="btn-login" class="btn-main">ENTER LOBBY</button>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobby-screen" class="overlay hidden">
    <div class="lobby-header">
      <h2 class="glitch-title-sm">KILLER 07 LOBBY</h2>
      <div id="player-count">Players: 0/9</div>
    </div>
    <div id="lobby-players-list"></div>
    <button id="btn-start" class="btn-main">START GAME</button>
  </div>

  <!-- IN-GAME HUD -->
  <div id="game-hud" class="hidden">
    <!-- Top Bar: Health, Stamina, Sanity -->
    <div class="hud-top">
      <div class="stat-box">
        <div class="stat-bar"><div id="health-bar"></div></div>
        <span>HEALTH</span>
      </div>
      <div class="stat-box">
        <div class="stat-bar"><div id="stamina-bar"></div></div>
        <span>STAMINA</span>
      </div>
      <div class="stat-box">
        <div class="stat-bar"><div id="sanity-bar"></div></div>
        <span>SANITY</span>
      </div>
    </div>

    <!-- Escapes Tracker -->
    <div id="escape-tracker">
      <div>🚪 Gate: <span id="gate-count">0/4</span></div>
      <div>🚁 Heli: <span id="heli-count">0/4</span></div>
      <div>🚤 Boat: <span id="boat-count">0/4</span></div>
    </div>

    <!-- Interaction & Jumpscare Overlays -->
    <div id="heartbeat-overlay"></div>
    <div id="vhs-glitch"></div>
    <div id="interaction-prompt" class="hidden">Press [E] or Tap to Interact</div>
    <div id="jumpscare-overlay" class="hidden">YOU WERE ELIMINATED</div>

    <!-- Touch Mobile Controls -->
    <div id="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-knob"></div>
      </div>
      <div class="action-buttons">
        <button id="btn-run" class="ctrl-btn">RUN</button>
        <button id="btn-crouch" class="ctrl-btn">CROUCH</button>
        <button id="btn-flash" class="ctrl-btn">FLASH</button>
        <button id="btn-interact" class="ctrl-btn">ACTION</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
